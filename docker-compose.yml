services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: taxi-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data
    networks:
      - data_pipeline

  nifi:
    image: apache/nifi:2.4.0
    container_name: taxi-nifi
    ports:
      - "8443:8443"
    environment:
      NIFI_WEB_HTTPS_PORT: "8443"
      SINGLE_USER_CREDENTIALS_USERNAME: ${NIFI_USERNAME:?Set NIFI_USERNAME in .env}
      SINGLE_USER_CREDENTIALS_PASSWORD: ${NIFI_PASSWORD:?Set NIFI_PASSWORD in .env}
    volumes:
      - ./raw:/opt/nifi/nifi-current/input:ro
      - nifi_conf:/opt/nifi/nifi-current/conf
      - nifi_state:/opt/nifi/nifi-current/state
      - nifi_database:/opt/nifi/nifi-current/database_repository
      - nifi_flowfile:/opt/nifi/nifi-current/flowfile_repository
      - nifi_content:/opt/nifi/nifi-current/content_repository
      - nifi_provenance:/opt/nifi/nifi-current/provenance_repository
    networks:
      - data_pipeline

volumes:
  minio_data:
  nifi_conf:
  nifi_state:
  nifi_database:
  nifi_flowfile:
  nifi_content:
  nifi_provenance:

networks:
  data_pipeline:
    driver: bridge
